# mmwX-tgbot 配置示例
#
# 复制为 config.yaml 或路径 -c 指定。
# 也支持环境变量覆盖(MMWX_TGBOT_<UPPER_SNAKE>),例如:
#   MMWX_TGBOT_MMWX_URL=https://mmw.domain.com
#   MMWX_TGBOT_TG_BOT_TOKEN=12345:xxx

# 主控 mmwx 地址(末尾不带斜杠)
mmwx_url: https://mmw.domain.com

# 主控 admin token(系统设置页 → API Token)
mmwx_api_token: REPLACE_WITH_ADMIN_TOKEN

# 来自 @BotFather 的 bot token
tg_bot_token: REPLACE_WITH_BOT_TOKEN

# 谁能用 /admin_* 命令(TG user id 数组)
admin_tg_ids:
  - 123456789

# 调主控 HTTP 超时秒数(默认 8)
http_timeout_seconds: 8

# Mini App HTTP 服务监听地址(默认 127.0.0.1:23088,只听回环),由前置 nginx 反代到公网 HTTPS
webapp_listen: "127.0.0.1:23088"
# Mini App 公网 HTTPS 地址(nginx 暴露的)。非空时设为 TG 菜单按钮;留空则不显示入口。
webapp_url: ""
# 调试用:允许从 ?initData= 读取做本地浏览器预览。生产务必保持 false。
webapp_dev_preview: false
